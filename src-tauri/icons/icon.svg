<!-- ViaLink's app icon: a keycap seen from above with the V of Vial on its face.
     The source of every icon in this folder: `pnpm tauri icon src-tauri/icons/icon.svg -o <dir>`
     renders them; copy over the files that are here (it also makes Android, iOS and
     Windows Store ones, which ViaLink doesn't ship). The same drawing, without the
     margin, is the favicon (index.html, docs/*.html) and the top bar logo
     (src/app/shell/Logo.tsx). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-4 -4 72 72">
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <rect x="11" y="12" width="42" height="42" rx="9" fill="#0a4f4a"/>
  <rect x="16" y="14" width="32" height="31" rx="6" fill="#2dd4bf"/>
  <path d="M24 22 L32 37 L40 22" fill="none" stroke="#04201c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
