<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Crect x='11' y='12' width='42' height='42' rx='9' fill='%230a4f4a'/%3E%3Crect x='16' y='14' width='32' height='31' rx='6' fill='%232dd4bf'/%3E%3Cpath d='M24 22 L32 37 L40 22' fill='none' stroke='%2304201c' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>ViaLink</title>
    <script>
      // Same rule as src/app/theme.ts, run before first paint.
      try {
        var t = localStorage.getItem("vialink.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.setAttribute("data-mode", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
