<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!-- Installable as an app in Chromium browsers (install.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060606" media="(prefers-color-scheme: dark)" />
    <title>ViaLink</title>
    <script>
      // Same rule as src/app/theme.ts, run before first paint.
      try {
        var t = localStorage.getItem("vialink.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.setAttribute("data-mode", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
