<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='10' rx='2' fill='%23356'/%3E%3Crect x='3' y='5' width='2' height='2' fill='%23fff'/%3E%3Crect x='7' y='5' width='2' height='2' fill='%23fff'/%3E%3Crect x='11' y='5' width='2' height='2' fill='%23fff'/%3E%3Crect x='4' y='9' width='8' height='2' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>ViaLink</title>
    <script>
      // Same rule as src/app/theme.ts, run before first paint.
      try {
        var t = localStorage.getItem("vialink.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.setAttribute("data-mode", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
