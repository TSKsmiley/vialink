name: Desktop app

# Builds the Tauri desktop app (src-tauri/) and keeps the installers as this
# run's artifacts (Summary page of the run, "Artifacts"):
# - Linux: .deb and .rpm (about 2 MB; they use the system's WebKitGTK) and an
#   .AppImage (one file that runs on most distributions, WebKitGTK inside).
# - macOS: one universal .dmg for Apple Silicon and Intel Macs, ad-hoc signed.
# - Windows: an .exe installer and an .msi.
# Runs on pull requests and pushes to master that touch the app, by hand from
# the Actions tab, and on desktop-v* tags, which also attach the installers to
# a draft GitHub release. Not signed with a certificate yet, so macOS and
# Windows ask the user to confirm the first time it opens.

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - ".github/workflows/desktop.yml"
  push:
    branches: [master]
    # Path filters don't apply to tag pushes: a desktop-v* tag always builds.
    tags: ["desktop-v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04 # older glibc, so the packages run on more distributions
            args: ""
          - name: macOS
            runner: macos-latest
            args: "--target universal-apple-darwin"
          - name: Windows
            runner: windows-latest
            args: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # only used to attach installers to a draft release on desktop-v* tags
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages (WebKitGTK for the window, libudev for hidapi)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libudev-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only a tag makes a (draft) release; every other run just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ViaLink desktop ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ViaLink-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
