name: Desktop app

# Builds the Tauri desktop app (src-tauri/) and keeps the installers as this
# run's artifacts (Summary page of the run, "Artifacts"):
# - Linux: .deb and .rpm (about 2 MB; they use the system's WebKitGTK) and an
#   .AppImage (one file that runs on most distributions, WebKitGTK inside).
# - macOS: one universal .dmg for Apple Silicon and Intel Macs, ad-hoc signed.
# - Windows: an .exe installer and an .msi.
# Runs on pull requests that touch the app, by hand from the Actions tab, and
# on desktop-v* tags, which also attach the installers to a draft GitHub
# release. Pushes to master don't build: a release pushes master and its tag
# together, and the tag's run is the one that counts, so a master build would
# repeat it (CI still tests every push).
# Not signed with a certificate yet, so macOS and Windows ask the user to
# confirm the first time it opens.
#
# Updates: once the updater key is set up (README, "Releasing the desktop
# app"), builds carry the updater and signed update files, and a tag's draft
# release gets the latest.json that installed apps read once it is published.
# Without the key the builds simply have no updater.

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04 # older glibc, so the packages run on more distributions
            args: ""
          - name: macOS
            runner: macos-latest
            args: "--target universal-apple-darwin"
          - name: Windows
            runner: windows-latest
            args: ""
    runs-on: ${{ matrix.runner }}
    env:
      # Empty until the updater key is set up; see the comment at the top.
      VIALINK_UPDATER_PUBKEY: ${{ vars.VIALINK_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    permissions:
      contents: write # only used to attach installers to a draft release on desktop-v* tags
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages (WebKitGTK for the window, libudev for hidapi)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libudev-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: The tag names the app's version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: test "desktop-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Updater config (once the updater key is set up)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: node scripts/updater-config.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only a tag makes a (draft) release; every other run just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ViaLink desktop ${{ github.ref_name }}
          releaseDraft: true
          # Update files only when the private key is there to sign them.
          args: ${{ matrix.args }}${{ env.TAURI_SIGNING_PRIVATE_KEY != '' && ' --config src-tauri/tauri.updater.conf.json' || '' }}
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        with:
          name: ViaLink-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
